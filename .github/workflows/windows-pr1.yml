# Test branch only, never part of PR 1: everything on a fresh Windows runner.
name: Windows PR 1 full test

on:
  push:
    branches: [ci/windows-pr1-fulltest]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  WG_FUZZ_ITERS: "200000"

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 350
    env:
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Machine
        run: |
          mkdir -p evidence
          { systeminfo | grep -E '^OS (Name|Version)'; df -h /c; rustup show; } 2>&1 | tee evidence/machine.txt
      - name: Toolchain and tools
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy rustfmt
      - name: Build the web UI
        run: |
          cd warpgate-web
          npm ci
          npm run build
      - name: Migration test
        continue-on-error: true
        run: |
          for i in 1 2 3; do cargo test --all-features -p warpgate-db-migrations --lib sqlite_migrations_run_through_a_pool 2>&1 | tee -a evidence/migrations.log; [ "${PIPESTATUS[0]}" = 0 ] || exit 1; done
      - name: Build warpgate.exe
        run: cargo build -p warpgate --all-features 2>&1 | tee evidence/build.log; exit ${PIPESTATUS[0]}
      - name: Install, run and use it
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --quiet paramiko==4.0.0 requests==2.32.5
          python .github/pr1/e2e.py target/debug/warpgate.exe evidence 2>&1 | Tee-Object evidence/e2e.log
          exit $LASTEXITCODE
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence
          path: evidence/

